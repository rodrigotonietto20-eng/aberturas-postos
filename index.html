<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abertura de Postos — Rede Sander</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e65100">
<style>
:root{
  --pri:#e65100; --pri2:#f57c00; --pri3:#ffb74d; --pri-light:#fff3e0; --pri-deep:#8f3300;
  --bg:#fff8f0; --bg2:#fef0e0; --card:#ffffff; --text:#2b2016; --muted:#8a7a68;
  --ok:#2e7d32; --ok-bg:#e8f5e9;
  --andamento:#b8770a; --andamento-bg:#fff4e0;
  --pendente:#c62828; --pendente-bg:#fdecea;
  --na:#757575; --na-bg:#eeeeee;
  --border:#e8dcce;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
.header{background:linear-gradient(100deg,var(--pri3),var(--pri2) 55%,var(--pri-deep));color:#fff;padding:16px 18px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.15);}
.header h1{margin:0;font-size:18px;font-weight:700;}
.header .sub{font-size:12.5px;opacity:.92;margin-top:2px;}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.back-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer;}
.back-btn:active{background:rgba(255,255,255,.35);}
.container{max-width:960px;margin:0 auto;padding:16px;padding-bottom:60px;}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid var(--border);}
.btn{background:var(--pri2);color:#fff;border:none;padding:11px 16px;border-radius:10px;font-size:14.5px;font-weight:600;cursor:pointer;}
.btn:active{background:var(--pri);}
.btn-outline{background:#fff;color:var(--pri2);border:1.5px solid var(--pri2);}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px;}
.btn-block{width:100%;}
.fab{position:fixed;right:18px;bottom:18px;border-radius:50px;padding:14px 20px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:15px;z-index:15;}

/* ===== Lista de Postos ===== */
.posto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:14px;}
.posto-card{cursor:pointer;transition:transform .1s;position:relative;}
.posto-card:active{transform:scale(.98);}
.posto-card h3{margin:0 0 4px;font-size:16px;color:var(--pri-deep);padding-right:26px;}
.posto-del-btn{position:absolute;top:12px;right:12px;background:none;border:none;font-size:16px;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:6px;}
.posto-del-btn:active{background:var(--pendente-bg);color:var(--pendente);}
.posto-card .meta{font-size:12.5px;color:var(--muted);margin-bottom:10px;}
.progress-bar{height:8px;border-radius:6px;background:var(--border);overflow:hidden;display:flex;}
.progress-bar div{height:100%;}
.posto-card .pct{font-size:12px;color:var(--muted);margin-top:6px;}
.posto-obs{font-size:12px;font-weight:700;color:var(--pri-deep);background:var(--pri-light);border-left:3px solid var(--pri2);border-radius:6px;padding:5px 8px;margin-bottom:10px;}
.empty-state{text-align:center;color:var(--muted);padding:40px 20px;}

/* ===== Dashboard ===== */
.summary-bar{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.summary-tile{flex:1;min-width:130px;border-radius:14px;padding:14px 16px;text-align:center;}
.summary-tile .num{font-size:28px;font-weight:800;line-height:1;}
.summary-tile .lbl{font-size:12px;margin-top:4px;font-weight:600;}
.tile-ok{background:var(--ok-bg);color:var(--ok);}
.tile-pend{background:var(--pendente-bg);color:var(--pendente);}
.tile-and{background:var(--andamento-bg);color:var(--andamento);}
.tile-na{background:var(--na-bg);color:var(--na);}

.setor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
.setor-card{cursor:pointer;text-align:left;position:relative;}
.setor-card:active{transform:scale(.98);}
.setor-card .icon{font-size:24px;}
.setor-card h4{margin:8px 0 2px;font-size:14.5px;color:var(--pri-deep);}
.setor-card .total{font-size:11.5px;color:var(--muted);}
.badge-pend{position:absolute;top:10px;right:10px;background:var(--pendente);color:#fff;font-size:12px;font-weight:700;border-radius:20px;padding:2px 9px;}
.badge-zero{background:var(--ok);}

/* ===== Setor detail ===== */
.item-row{border-bottom:1px solid var(--border);padding:14px 0 14px 11px;border-left:3px solid transparent;transition:background .2s;}
.item-row.done{background:var(--ok-bg);border-left-color:var(--ok);}
.item-row:last-child{border-bottom:none;}
.geral-group-header{margin:20px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--border);font-weight:700;color:var(--pri-deep);font-size:14.5px;}
.geral-group-header:first-child{margin-top:0;}
.item-title{font-weight:600;font-size:14.5px;margin-bottom:2px;}
.item-fase{font-size:11px;color:var(--muted);margin-bottom:8px;}
.item-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;}
select, input[type=text], textarea{
  font-family:inherit;font-size:13.5px;padding:7px 9px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);
}
.status-select{font-weight:700;}
.status-Pendente{color:var(--pendente);background:var(--pendente-bg);border-color:var(--pendente);}
.status-Em_Andamento{color:var(--andamento);background:var(--andamento-bg);border-color:var(--andamento);}
.status-Concluido{color:var(--ok);background:var(--ok-bg);border-color:var(--ok);}
.status-N_A{color:var(--na);background:var(--na-bg);border-color:var(--na);}
input.responsavel{width:150px;}
textarea.obs{width:100%;min-height:34px;resize:vertical;margin-top:4px;}
.np-obs-wrap{background:var(--pri-light);border:1.5px solid var(--pri3);border-radius:10px;padding:10px 12px;margin-top:14px;}
.np-obs-wrap label{margin:0 0 6px;font-weight:700;color:var(--pri-deep);}
.np-obs-wrap textarea{width:100%;resize:vertical;}
.transfer-btn{background:var(--pri-light);color:var(--pri2);border:1px solid var(--pri3);}
.transfer-row{margin-top:6px;display:none;gap:8px;align-items:center;}
.transfer-row.open{display:flex;flex-wrap:wrap;}
.transfer-hist{font-size:11px;color:var(--muted);margin-top:5px;}
.anexo-btn{background:var(--pri-light);color:var(--pri2);border:1px solid var(--pri3);cursor:pointer;}
.share-btn{background:var(--pri-light);color:var(--pri2);border:1px solid var(--pri3);}
.edit-btn{background:#fff;color:var(--muted);border:1px solid var(--border);}
.del-btn{background:var(--pendente-bg);color:var(--pendente);border:1px solid var(--pendente);}
.link-badge{font-size:11px;color:var(--pri2);margin-bottom:6px;}
.compartilhar-lista{max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin:8px 0 4px;}
.compartilhar-row{display:flex;align-items:center;gap:8px;font-size:13.5px;}
.anexo-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.anexo-chip{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:3px 8px;font-size:12px;}
.anexo-chip a{color:var(--pri2);text-decoration:none;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.anexo-del{border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0 0 0 2px;line-height:1;}
.anexo-del:hover{color:#c0392b;}
.anexo-status{font-size:11px;color:var(--muted);margin-top:4px;}
.demandas-box{margin-top:8px;}
.demandas-list{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;}
.demanda-row{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--pendente-bg);border-radius:8px;padding:5px 8px;transition:background .15s;}
.demanda-row .demanda-txt{flex:1;color:var(--pendente);}
.demanda-row.done{background:var(--ok-bg);}
.demanda-row.done .demanda-txt{color:var(--ok);}
.demanda-check{accent-color:var(--ok);width:16px;height:16px;}
.demanda-del{border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0 2px;line-height:1;}
.demanda-del:hover{color:#c0392b;}
.demanda-add{display:flex;gap:6px;}
.demanda-add .demanda-input{flex:1;font-size:12.5px;padding:6px 8px;}

.filter-chips{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.chip{padding:6px 12px;border-radius:20px;font-size:12.5px;border:1.5px solid var(--border);background:#fff;cursor:pointer;color:var(--muted);}
.chip.active{background:var(--pri2);color:#fff;border-color:var(--pri2);}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:14px;padding:20px;max-width:400px;width:100%;}
.modal h3{margin-top:0;}
.modal label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;}
.modal input, .modal select{width:100%;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.sync-note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:16px;}
.setores-lista{max-height:280px;overflow-y:auto;border-top:1px solid var(--border);}
.setor-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);}
.setor-row input[type=text]{padding:6px 8px;font-size:13px;}
.setor-row .sr-icone{width:44px;text-align:center;flex-shrink:0;}
.setor-row .sr-nome{flex:1;min-width:0;}
.setor-row .sr-salvar,.setor-row .sr-excluir{flex-shrink:0;}
.setor-row .sr-salvar{flex-shrink:0;}
.link-config{color:var(--pri2);}
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <div>
      <h1 id="hdr-title">Abertura de Postos</h1>
      <div class="sub" id="hdr-sub">Rede Sander</div>
    </div>
    <button class="back-btn" id="btn-back" style="display:none">← Voltar</button>
  </div>
</div>

<div class="container" id="app"></div>

<button class="btn fab" id="btn-novo-posto" style="display:none">+ Novo Posto</button>

<!-- Modal: novo posto -->
<div class="modal-bg" id="modal-novo-posto">
  <div class="modal">
    <h3 id="np-titulo">Novo Posto</h3>
    <label>Nome do posto</label>
    <input type="text" id="np-nome" placeholder="Ex: Canela">
    <label>Bandeira</label>
    <input type="text" id="np-bandeira" placeholder="Ex: Rodoil, Vibra, Ipiranga">
    <label>Data de abertura prevista</label>
    <input type="date" id="np-data">
    <div class="np-obs-wrap">
      <label>📝 Observação</label>
      <textarea id="np-obs" placeholder="Um pequeno descritivo sobre este posto..." rows="3"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline btn-block" id="np-cancel">Cancelar</button>
      <button class="btn btn-block" id="np-confirmar">Criar checklist</button>
    </div>
  </div>
</div>

<!-- Modal: config sync -->
<div class="modal-bg" id="modal-config">
  <div class="modal">
    <h3>Configuração de sincronização</h3>
    <label>URL do Google Apps Script (SCRIPT_URL)</label>
    <input type="text" id="cfg-url" placeholder="https://script.google.com/macros/s/.../exec">
    <div class="modal-actions">
      <button class="btn btn-outline btn-block" id="cfg-cancel">Cancelar</button>
      <button class="btn btn-block" id="cfg-salvar">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal: nova pergunta/item num setor -->
<div class="modal-bg" id="modal-novo-item">
  <div class="modal">
    <h3>Adicionar pergunta</h3>
    <label>Pergunta / item para este setor</label>
    <input type="text" id="ni-texto" placeholder="Ex: Verificar contrato de manutenção do ar condicionado">
    <div class="modal-actions">
      <button class="btn btn-outline btn-block" id="ni-cancel">Cancelar</button>
      <button class="btn btn-block" id="ni-confirmar">Adicionar</button>
    </div>
  </div>
</div>

<!-- Modal: compartilhar pergunta com outros setores -->
<div class="modal-bg" id="modal-compartilhar">
  <div class="modal" style="max-width:420px">
    <h3>🔗 Compartilhar pergunta</h3>
    <div style="font-size:13px;color:var(--muted);margin-bottom:6px" id="cp-pergunta-texto"></div>
    <label>Compartilhar também com (cada setor marcado ganha sua própria cópia, com status independente):</label>
    <div id="cp-lista" class="compartilhar-lista"></div>
    <div class="modal-actions">
      <button class="btn btn-outline btn-block" id="cp-cancel">Cancelar</button>
      <button class="btn btn-block" id="cp-confirmar">Compartilhar</button>
    </div>
  </div>
</div>

<!-- Modal: gerenciar setores -->
<div class="modal-bg" id="modal-setores">
  <div class="modal" style="max-width:460px">
    <h3>🗂️ Gerenciar Setores</h3>
    <div id="setores-lista" class="setores-lista"></div>
    <label style="margin-top:16px">+ Novo setor</label>
    <div style="display:flex;gap:8px">
      <input type="text" id="ns-icone" placeholder="📌" style="width:56px;text-align:center">
      <input type="text" id="ns-nome" placeholder="Nome do setor" style="flex:1">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline btn-block" id="ns-fechar">Fechar</button>
      <button class="btn btn-block" id="ns-adicionar">Adicionar setor</button>
    </div>
  </div>
</div>

<script>
/* ================= CONFIG ================= */
var SCRIPT_URL_DEFAULT = 'https://script.google.com/macros/s/AKfycbzb9VVtpKG2Td5qELrq4I9cl-g5mIawK7gSXiaSIlXOphxIoBCc6q8FngdTxqfkl-7bEA/exec';
function getScriptUrl(){ return localStorage.getItem('ab_script_url') || SCRIPT_URL_DEFAULT; }

var STATUS_LIST = ['Pendente','Em Andamento','Concluído','N/A'];
function statusClass(s){ return 'status-' + s.replace(/[\s\/]/g,'_').replace(/í/g,'i'); }

/* Lista padrão de fábrica — a lista realmente usada (SETORES) é carregada de
   localStorage/nuvem em loadSetores(), pra permitir incluir/editar setor sem mexer no
   código (ver seção "Gerenciar Setores"). Isso aqui só serve de valor inicial/fallback. */
var SETORES_DEFAULT = [
  {key:'Direção', icone:'🧭'},
  {key:'Contabilidade', icone:'📊'},
  {key:'Obras / Meio Ambiente', icone:'🏗️'},
  {key:'Logística', icone:'🚚'},
  {key:'Compras', icone:'🛒'},
  {key:'CD', icone:'🏭'},
  {key:'Operação', icone:'⚙️'},
  {key:'Varejo / Mix', icone:'🏪'},
  {key:'Estoque / Auditoria', icone:'📦'},
  {key:'Pricing', icone:'💲'},
  {key:'T.I', icone:'💻'},
  {key:'Marketing', icone:'📣'},
  {key:'RH', icone:'👥'},
  {key:'Faturamento', icone:'💳'},
  {key:'Comercial', icone:'🤝'},
  {key:'Jurídico', icone:'⚖️'},
  {key:'P.A', icone:'🚗'}
];
var SETORES = SETORES_DEFAULT.slice();

/* Responsável padrão por setor — baseado nos nomes que mais aparecem na planilha original.
   Só um valor inicial: o campo "Responsável" de cada item continua editável (trocar ou
   incluir mais um nome, ex: "Shana / Fulano") direto na tela do setor ou na Visão Geral. */
var SETOR_RESPONSAVEL_DEFAULT = {
  'Direção': 'Pablo',
  'Contabilidade': 'Segalin / Pedro',
  'Obras / Meio Ambiente': 'Roberto',
  'Logística': 'Jairo',
  'Compras': 'Joane',
  'CD': 'Jonas',
  'Operação': 'GU',
  'Varejo / Mix': 'Facilitadoras',
  'Estoque / Auditoria': 'Cassiano',
  'Pricing': 'Renan',
  'T.I': 'Atila',
  'Marketing': 'Carla',
  'RH': 'LUCI',
  'Faturamento': 'Jessica',
  'Comercial': 'Pasquali',
  'Jurídico': 'Maite',
  'P.A': 'Pasquali'
};

/* item template: [texto, fase, setor]
   Reescrito em 2026-07-29 a partir da planilha "abertura correto.xlsx" (aba "Gloria
   Vacaria", versão corrigida enviada pelo usuário — a versão anterior, com abas extras,
   estava errada) — substitui por completo a lista anterior de 166 itens. Só afeta postos
   criados a partir de agora; postos já existentes mantêm os itens que já tinham. Essa
   planilha é bem mais detalhada (~230 linhas) e trouxe 2 setores novos que não existiam no
   app — confirmados com o usuário antes de criar: "Jurídico" (contratos de internet,
   vigilância, seguro patrimonial) e "P.A" (Produtos Automotivos, antes dentro de Compras).
   Onde a planilha listava o mesmo item em duas seções diferentes (ex: "Limpeza caixa
   separadora" duas vezes dentro de OPERAÇÃO), mantido só uma vez; onde aparecia em setores
   diferentes (ex: "Livro do ministério do trabalho"), tratado como intencional e mantido
   uma vez no setor mais específico. "Bicos, mangueiras, rodilhas" e o "Material de
   Pista/Consumo/limpeza loja" foram mantidos em CD, mesmo padrão já usado antes.
   Revisado em 2026-07-29 contra "ABERTURA POSTOS lira.xlsx" (mesma aba "Gloria Vacaria",
   nome de arquivo diferente) — comparação item a item confirmou que batia certinho, exceto
   2 itens que tinham ficado de fora na reescrita: "Precisa de bicos, mangueiras e rodilhas
   de combustível" (Obras/Manutenção) e "Marecas, rodos para brisa e pista" (Operação),
   adicionados agora perto dos itens equivalentes. */
/* item template: [texto, fase, setor]
   Sincronizado em 2026-07-30 com o estado atual real do posto "Vacaria Gloria 085" (o
   prototipo/planilha viva da equipe) — a fonte de verdade deixou de ser a planilha .xlsx
   original e passou a ser esse posto, que a equipe vem editando (texto de pergunta,
   responsavel, novas perguntas) direto no app desde a criacao. Extraido via GET no
   SCRIPT_URL e comparado item a item contra o ITEMS_TEMPLATE anterior (de 221 itens)
   pra gerar esta lista de 224. So afeta postos criados a partir de agora.
   Ajustes feitos na extracao (nao e copia 1:1 do posto Gloria):
   - setor "Auditoria" (2 itens) normalizado pra "Estoque / Auditoria" (nome canonico).
   - setor "varejo/PA" (bug antigo, nao e um setor real do app) removido: 6 dos 8 itens
     que estavam la eram duplicata de pergunta ja existente em outro setor (descartados);
     os outros 2 ("Tambor de Arla, tamanho?" e "Multiplicador na abertura mais dois dias")
     eram perguntas novas legitimas, movidas pra "P.A".
   - "Definicao de precos dos combustiveis na abertura" (Pricing) descartado por ser
     duplicata de "Definicao dos precos dos combustiveis apos abertura", ja presente.
   Postos ja existentes (Gloria, Chapada, Bertella Passo Fundo) nao sao alterados por
   essa mudanca — cada um guarda copia propria dos itens que ja tinha. */
var ITEMS_TEMPLATE = [
["Contrato de locação.","Direção","Contabilidade"],
["Definição da data de abertura","Direção","Direção"],
["Vai operar com qual CNPJ","Direção","Direção"],
["Serviços disponibilizados no posto","Direção","Direção"],
["Loja sera reformada ?  Qual projeto , qual loja ?","Direção","Direção"],
["Classificação do posto (Urbano/Rodovia)","Direção","Direção"],
["Definição do parque de bombas","Direção","Direção"],
["Previsão de venda — Combustíveis, Loja e P.A","Direção","Direção"],
["Definição do tipo do Totem Sander","Direção","Direção"],
["Definição do tipo e quantidade de cavaletes e lonas de preços","Direção","Direção"],
["Definição dos preços dos combustíveis apos abertura","Direção","Pricing"],
["Horário da Filial","Direção","Direção"],
["Cartão CNPJ","Documentação","Contabilidade"],
["FEPAN","Documentação","Obras / Meio Ambiente"],
["Alvará dos Bombeiros (PPCI)","Documentação","Obras / Meio Ambiente"],
["Alvará de Localização","Documentação","Obras / Meio Ambiente"],
["Alvará de Sanitário","Documentação","Obras / Meio Ambiente"],
["ANP","Documentação","Obras / Meio Ambiente"],
["IPTU","Documentação","Obras / Meio Ambiente"],
["FISQPs disponíveis","Documentação","Obras / Meio Ambiente"],
["Revenda de GLP — viabilidade","Documentação","Obras / Meio Ambiente"],
["Placa GEAB","Documentação","Obras / Meio Ambiente"],
["Detetização, desratização","Documentação","Obras / Meio Ambiente"],
["Limpeza da caixa d'água","Documentação","Obras / Meio Ambiente"],
["Outorga do poço artesiano","Documentação","Obras / Meio Ambiente"],
["Certificado Digital/Senha","Documentação","T.I"],
["Instalação ou troca de titularidade de água e luz","Documentação","Obras / Meio Ambiente"],
["SASC (Tancagem, Nº de bicos, Nº Bombas, Mapa, Modelo Bombas)","Documentação","Obras / Meio Ambiente"],
["Contratação de empresa para coleta de resíduos","Documentação","Obras / Meio Ambiente"],
["Definição de empresa de monitoramento/câmeras","Documentação","Obras / Meio Ambiente"],

/* Demandas padrão por pergunta — algumas perguntas do template já nascem com uma lista de
   checkboxes pronta pra marcar (em vez de depender de texto livre na Observação). Valor
   inicial/fallback só — a lista realmente usada (DEMANDAS_DEFAULT_POR_ITEM) é carregada de
   localStorage/nuvem em loadDemandasPadrao(): toda demanda nova que alguém digitar em
   qualquer posto vira automaticamente padrão pra próximos postos com a mesma pergunta (ver
   registrarDemandaPadrao()). Só afeta postos criados depois; postos já existentes mantêm o
   que já tinham. */
var DEMANDAS_DEFAULT_POR_ITEM_DEFAULT = {
  'Serviços disponibilizados no posto': ['Banheiro','Troca de óleo','Wi-Fi','Borracharia','Lavanderia','Lavagem','Conveniência','Hotel','GLP','Lubrificação','Eletroposto']
};
var DEMANDAS_DEFAULT_POR_ITEM = {};

/* ================= STATE ================= */
var DATA = { postos: [] };
var STATE = { tela:'lista', postoId:null, setorAtual:null };

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function loadData(){
  try{
    var raw = localStorage.getItem('ab_data');
    DATA = raw ? JSON.parse(raw) : { postos: [] };
  }catch(e){ DATA = { postos: [] }; }
}

function loadSetores(){
  try{
    var raw = localStorage.getItem('ab_setores');
    var salvos = raw ? JSON.parse(raw) : null;
    SETORES = (salvos && salvos.length) ? salvos : SETORES_DEFAULT.slice();
  }catch(e){ SETORES = SETORES_DEFAULT.slice(); }
}
function saveSetoresLocal(){ localStorage.setItem('ab_setores', JSON.stringify(SETORES)); }

function adicionarSetor(nome, icone){
  nome = nome.trim();
  if(!nome) return;
  if(SETORES.some(function(s){ return s.key===nome; })){ alert('Já existe um setor com esse nome.'); return; }
  SETORES.push({key:nome, icone: icone.trim() || '📌'});
  saveSetoresLocal();
  syncPushSetores();
}

/* Renomear um setor precisa migrar item.setor em todos os itens de todos os postos deste
   aparelho (DATA.postos) — sem isso os itens continuariam guardando o nome antigo. Como
   saveData() reenvia DATA.postos inteiro pro backend (upsert por ID), a migração se
   propaga pra nuvem e chega nos outros aparelhos no próximo sync deles. */
function editarSetor(oldKey, novoNome, novoIcone){
  novoNome = novoNome.trim();
  if(!novoNome) return;
  if(novoNome!==oldKey && SETORES.some(function(s){ return s.key===novoNome; })){ alert('Já existe um setor com esse nome.'); return; }
  var s = SETORES.find(function(s){ return s.key===oldKey; });
  if(!s) return;
  s.key = novoNome;
  s.icone = novoIcone.trim() || s.icone;
  if(novoNome!==oldKey){
    if(SETOR_RESPONSAVEL_DEFAULT[oldKey]!==undefined){
      SETOR_RESPONSAVEL_DEFAULT[novoNome] = SETOR_RESPONSAVEL_DEFAULT[oldKey];
      delete SETOR_RESPONSAVEL_DEFAULT[oldKey];
    }
    DATA.postos.forEach(function(p){
      p.itens.forEach(function(it){ if(it.setor===oldKey) it.setor = novoNome; });
    });
    if(STATE.setorAtual===oldKey) STATE.setorAtual = novoNome;
    saveData();
  }
  saveSetoresLocal();
  syncPushSetores();
}

// Bloqueia exclusão se alguma pergunta (de qualquer posto) ainda estiver nesse setor —
// excluir sem migrar deixaria itens "orfãos" presos num setor que não existe mais nos
// cards do Dashboard. O usuário precisa transferir as perguntas antes (mesmo botão 🔀
// Transferir já existente em cada item).
function excluirSetor(key){
  var emUso = DATA.postos.some(function(p){ return p.itens.some(function(it){ return it.setor===key; }); });
  if(emUso){
    alert('Não é possível excluir "'+key+'": ainda existem perguntas nesse setor em pelo menos um posto. Transfira essas perguntas pra outro setor antes de excluir.');
    return;
  }
  if(!confirm('Excluir o setor "'+key+'"? Essa ação não pode ser desfeita.')) return;
  SETORES = SETORES.filter(function(s){ return s.key!==key; });
  delete SETOR_RESPONSAVEL_DEFAULT[key];
  saveSetoresLocal();
  var url = getScriptUrl();
  if(url){
    fetch(url, { method:'POST', body: JSON.stringify({excluirSetorKey:key}) }).catch(function(){});
  }
}

function syncPushSetores(){
  var url = getScriptUrl();
  if(!url) return;
  fetch(url, { method:'POST', body: JSON.stringify({ setores: SETORES }) }).catch(function(){});
}

function loadDemandasPadrao(){
  try{
    var raw = localStorage.getItem('ab_demandas_padrao');
    var salvos = raw ? JSON.parse(raw) : null;
    DEMANDAS_DEFAULT_POR_ITEM = salvos || JSON.parse(JSON.stringify(DEMANDAS_DEFAULT_POR_ITEM_DEFAULT));
  }catch(e){ DEMANDAS_DEFAULT_POR_ITEM = JSON.parse(JSON.stringify(DEMANDAS_DEFAULT_POR_ITEM_DEFAULT)); }
}
function saveDemandasPadraoLocal(){ localStorage.setItem('ab_demandas_padrao', JSON.stringify(DEMANDAS_DEFAULT_POR_ITEM)); }

// Toda demanda nova digitada em qualquer posto vira padrão pra próximos postos com a mesma
// pergunta — pedido do usuário: "toda demanda criada com checkbox passe a ser nativa do app
// pra os próximos postos". Não mexe nas demandas de postos já existentes, só no molde usado
// por criarPosto() daqui pra frente.
function registrarDemandaPadrao(itemNome, texto){
  if(!DEMANDAS_DEFAULT_POR_ITEM[itemNome]) DEMANDAS_DEFAULT_POR_ITEM[itemNome] = [];
  var lista = DEMANDAS_DEFAULT_POR_ITEM[itemNome];
  var jaTem = lista.some(function(t){ return t.toLowerCase()===texto.toLowerCase(); });
  if(jaTem) return;
  lista.push(texto);
  saveDemandasPadraoLocal();
  syncPushDemandasPadrao();
}

function syncPushDemandasPadrao(){
  var url = getScriptUrl();
  if(!url) return;
  var registros = Object.keys(DEMANDAS_DEFAULT_POR_ITEM).map(function(k){ return { itemNome:k, textos:DEMANDAS_DEFAULT_POR_ITEM[k] }; });
  fetch(url, { method:'POST', body: JSON.stringify({ demandasPadrao: registros }) }).catch(function(){});
}

function saveData(postoId){
  localStorage.setItem('ab_data', JSON.stringify(DATA));
  syncPush(postoId);
}

function criarPosto(nome, bandeira, dataAbertura, observacao){
  var posto = {
    id: uid(),
    nome: nome,
    bandeira: bandeira,
    dataAbertura: dataAbertura,
    observacao: observacao || '',
    criadoEm: Date.now(),
    // t[3], se presente, é uma lista de setores extras — a pergunta nasce já multi-setor
    // (uma cópia por setor, mesmo grupoId, status independente cada). Ver "Compartilhar
    // pergunta" pra fazer isso manualmente depois de o posto já existir.
    itens: (function(){
      var out = [];
      ITEMS_TEMPLATE.forEach(function(t){
        var todosSetores = [t[2]].concat(t[3]||[]);
        var grupoId = todosSetores.length>1 ? uid() : null;
        todosSetores.forEach(function(setor){
          var demandasPadrao = (DEMANDAS_DEFAULT_POR_ITEM[t[0]]||[]).map(function(texto){ return { id: uid(), texto: texto, feito:false }; });
          out.push({ id: uid(), item:t[0], fase:t[1], setor:setor, responsavel: SETOR_RESPONSAVEL_DEFAULT[setor] || '', status:'Pendente', observacao:'', historico:[], anexos:[], demandas:demandasPadrao, grupoId: grupoId });
        });
      });
      return out;
    })()
  };
  DATA.postos.push(posto);
  saveData(posto.id);
  return posto.id;
}

// Itens da mesma pergunta compartilhados com outros setores (mesmo grupoId), do mesmo
// posto. Cada um tem status/responsável/observação independentes — só o texto e edições
// de pergunta se propagam entre eles.
function itensLigados(posto, item){
  if(!item.grupoId) return [];
  return posto.itens.filter(function(i){ return i.grupoId===item.grupoId && i.id!==item.id; });
}

function getPosto(id){ return DATA.postos.find(function(p){ return p.id===id; }); }

function excluirPosto(id){
  DATA.postos = DATA.postos.filter(function(p){ return p.id!==id; });
  localStorage.setItem('ab_data', JSON.stringify(DATA));
  var url = getScriptUrl();
  if(url){
    fetch(url, { method:'POST', body: JSON.stringify({excluirPostoId:id}) }).catch(function(){ /* falha silenciosa, já removido local */ });
  }
}

function contarStatus(itens){
  var c = {'Pendente':0,'Em Andamento':0,'Concluído':0,'N/A':0};
  itens.forEach(function(i){ c[i.status] = (c[i.status]||0)+1; });
  return c;
}

function renderListaPostos(){
  hdrTitle.textContent = 'Abertura de Postos';
  hdrSub.textContent = 'Rede Sander — selecione um posto ou crie um novo';
  btnBack.style.display = 'none';
  btnNovoPosto.style.display = 'block';

  var html = '';
  if(DATA.postos.length===0){
    html += '<div class="empty-state card">Nenhum posto em abertura ainda.<br>Toque em <b>+ Novo Posto</b> para começar o checklist.</div>';
  } else {
    html += '<div class="posto-grid">';
    DATA.postos.slice().reverse().forEach(function(p){
      var c = contarStatus(p.itens);
      var total = p.itens.length;
      var pct = total ? Math.round((c['Concluído']/total)*100) : 0;

function atualizarContadoresChips(itens){
  document.querySelectorAll('.chip').forEach(function(chipEl){
    var f = chipEl.getAttribute('data-f');

    chipEl.textContent = (f==='todos'?'Todos':f) + ' (' + count + ')';
  });
}

function wireItemRow(row, onStatusChange){
  var itemId = row.getAttribute('data-item');
  row.querySelectorAll('[data-field]').forEach(function(el){
    var evt = (el.tagName==='SELECT') ? 'change' : 'blur';
    el.addEventListener(evt, function(){
      var posto = getPosto(STATE.postoId);
      var item = posto.itens.find(function(i){ return i.id===itemId; });
      var field = el.getAttribute('data-field');
      item[field] = el.value;
      saveData(posto.id);
      if(field==='status'){
        // Atualiza só a cor/posição deste item em vez de recarregar a tela inteira —
        // assim um item recém concluído continua visível (fica verde) mesmo com um
        // filtro de status ativo, em vez de sumir da lista na hora.
        el.className = 'status-select ' + statusClass(item.status);
        row.classList.toggle('done', item.status==='Concluído');
        if(onStatusChange) onStatusChange();
      }
    });
  });
  var toggleBtn = row.querySelector('[data-action="toggle-transfer"]');
  toggleBtn.addEventListener('click', function(){
    document.getElementById('transfer-'+itemId).classList.toggle('open');
  });
  var confirmBtn = row.querySelector('[data-action="confirmar-transfer"]');
  confirmBtn.addEventListener('click', function(){
    var novoSetor = row.querySelector('.transfer-select').value;
    var posto = getPosto(STATE.postoId);
    var item = posto.itens.find(function(i){ return i.id===itemId; });
    item.historico.push({ de:item.setor, para:novoSetor, quando:Date.now() });
    item.setor = novoSetor;
    saveData(posto.id);
    render();
  });
  var anexoInput = row.querySelector('[data-action="anexar"]');
  if(anexoInput){
    anexoInput.addEventListener('change', function(){
      var file = anexoInput.files[0];
      if(!file) return;
      enviarAnexo(itemId, file, row);
      anexoInput.value = '';
    });
  }
  row.querySelectorAll('[data-action="remover-anexo"]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var idx = Number(btn.getAttribute('data-idx'));
      var posto = getPosto(STATE.postoId);
      var item = posto.itens.find(function(i){ return i.id===itemId; });
      item.anexos.splice(idx, 1);
      saveData(posto.id);
      render();
    });
  });
  var editBtn = row.querySelector('[data-action="editar-item"]');
  if(editBtn) editBtn.addEventListener('click', function(){
    var posto = getPosto(STATE.postoId);
    var item = posto.itens.find(function(i){ return i.id===itemId; });
    var novoTexto = prompt('Editar pergunta:', item.item);
    if(novoTexto===null) return;
    novoTexto = novoTexto.trim();
    if(!novoTexto){ alert('A pergunta não pode ficar em branco.'); return; }
    item.item = novoTexto;
    // Pergunta compartilhada (mesmo grupoId) — o texto é o mesmo em todos os setores,
    // então a edição propaga pra todas as cópias.
    if(item.grupoId){
      itensLigados(posto, item).forEach(function(li){ li.item = novoTexto; });
    }
    saveData(posto.id);
    render();
  });
  var shareBtn = row.querySelector('[data-action="compartilhar"]');
  if(shareBtn) shareBtn.addEventListener('click', function(){ abrirCompartilhar(itemId); });
  var delBtn = row.querySelector('[data-action="excluir-item"]');
  if(delBtn) delBtn.addEventListener('click', function(){
    var posto = getPosto(STATE.postoId);
    var item = posto.itens.find(function(i){ return i.id===itemId; });
    var msg = item.grupoId
      ? 'Excluir a pergunta "'+item.item+'" só deste setor? As cópias compartilhadas com outros setores continuam.'
      : 'Excluir a pergunta "'+item.item+'"? Essa ação não pode ser desfeita.';
    if(!confirm(msg)) return;
    excluirItem(STATE.postoId, itemId);
    render();
  });

  row.querySelectorAll('.demanda-check').forEach(function(chk){
    chk.addEventListener('change', function(){
      var idx = Number(chk.getAttribute('data-idx'));
      var posto = getPosto(STATE.postoId);
      var item = posto.itens.find(function(i){ return i.id===itemId; });
      item.demandas[idx].feito = chk.checked;
      saveData(posto.id);
      chk.closest('.demanda-row').classList.toggle('done', chk.checked);
    });
  });
  row.querySelectorAll('.demanda-del').forEach(function(btn){
    btn.addEventListener('click', function(){
      var idx = Number(btn.getAttribute('data-idx'));
      var posto = getPosto(STATE.postoId);
      var item = posto.itens.find(function(i){ return i.id===itemId; });
      item.demandas.splice(idx, 1);
      saveData(posto.id);
      render();
    });
  });
  var demInput = row.querySelector('.demanda-input');
  var demAddBtn = row.querySelector('.demanda-add-btn');
  function adicionarDemanda(){
    var texto = demInput.value.trim();
    if(!texto) return;
    var posto = getPosto(STATE.postoId);
    var item = posto.itens.find(function(i){ return i.id===itemId; });
    if(!item.demandas) item.demandas = [];
    item.demandas.push({ id: uid(), texto: texto, feito:false });
    saveData(posto.id);
    registrarDemandaPadrao(item.item, texto);
    render();
  }
  if(demAddBtn) demAddBtn.addEventListener('click', adicionarDemanda);
  if(demInput) demInput.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); adicionarDemanda(); } });
}

/* Remove local e avisa o backend explicitamente (excluirItemId) — o sync normal (upsert
   por ID em saveData()/syncPush()) só insere/atualiza os itens presentes no payload, nunca
   apaga; sem esse aviso o item "ressuscitaria" na próxima vez que outro aparelho sincronizasse. */
function excluirItem(postoId, itemId){
  var posto = getPosto(postoId);
  posto.itens = posto.itens.filter(function(i){ return i.id!==itemId; });
  saveData(postoId);
  var url = getScriptUrl();
  if(url){
    fetch(url, { method:'POST', body: JSON.stringify({excluirItemId:itemId}) }).catch(function(){});
  }
}

function enviarAnexo(itemId, file, row){
  var url = getScriptUrl();
  if(!url){ alert('Configure a sincronização antes de anexar arquivos.'); return; }
  var statusEl = row.querySelector('.anexo-status');
  if(statusEl) statusEl.textContent = 'Enviando '+file.name+'...';
  var posto = getPosto(STATE.postoId);
  var reader = new FileReader();
  reader.onload = function(){
    fetch(url, {
      method:'POST',
      body: JSON.stringify({ uploadAnexo: { postoId: posto.id, postoNome: posto.nome, nome: file.name, tipo: file.type, base64: reader.result } })
    }).then(function(r){ return r.json(); }).then(function(resp){
      if(!resp || !resp.ok || !resp.url) throw new Error('sem url');
      var item = posto.itens.find(function(i){ return i.id===itemId; });
      if(!item.anexos) item.anexos = [];
      item.anexos.push({ nome:file.name, url:resp.url, tipo:file.type, quando:Date.now() });
      saveData(posto.id);
      render();
    }).catch(function(){
      if(statusEl) statusEl.textContent = 'Falha ao enviar '+file.name+'. Tente novamente.';
    });
  };
  reader.readAsDataURL(file);
}

/* ================= HELPERS ================= */
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function escapeAttr(s){ return escapeHtml(s); }
function formatDate(d){
  if(!d) return 'sem data';
  // Rede de segurança: se vier um timestamp ISO completo (bug de Data do Sheets),
  // usa só os 10 primeiros caracteres (yyyy-MM-dd) antes de quebrar em partes.
  var parts = String(d).slice(0,10).split('-');
  if(parts.length===3) return parts[2]+'/'+parts[1]+'/'+parts[0];
  return d;
}
function formatDateTime(ts){
  var d = new Date(ts);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

// Mesmo modal serve pra criar e pra editar (nome/bandeira/data) — controlado por
// postoEditandoId: null = modo "Novo Posto", preenchido = modo "Editar Posto".
var modalNovoPosto = document.getElementById('modal-novo-posto');
var postoEditandoId = null;
btnNovoPosto.addEventListener('click', function(){

  document.getElementById('np-confirmar').textContent = 'Criar checklist';

  document.getElementById('np-bandeira').value='';
  document.getElementById('np-data').value='';

});
function abrirEditarPosto(posto){
  postoEditandoId = posto.id;
  document.getElementById('np-titulo').textContent = 'Editar Posto';
  document.getElementById('np-confirmar').textContent = 'Salvar alterações';
  document.getElementById('np-nome').value = posto.nome || '';
  document.getElementById('np-bandeira').value = posto.bandeira || '';
  document.getElementById('np-data').value = posto.dataAbertura || '';
  document.getElementById('np-obs').value = posto.observacao || '';

}
document.getElementById('np-cancel').addEventListener('click', function(){ modalNovoPosto.classList.remove('open'); });
document.getElementById('np-confirmar').addEventListener('click', function(){
  var nome = document.getElementById('np-nome').value.trim();
  if(!nome){ alert('Digite o nome do posto.'); return; }
  var bandeira = document.getElementById('np-bandeira').value.trim();
  var dataAbertura = document.getElementById('np-data').value;
  var observacao = document.getElementById('np-obs').value.trim();
  if(postoEditandoId){
    var posto = getPosto(postoEditandoId);
    posto.nome = nome;
    posto.bandeira = bandeira;
    posto.dataAbertura = dataAbertura;
    posto.observacao = observacao;
    saveData(posto.id);
    modalNovoPosto.classList.remove('open');
    render();
    return;
  }
  var id = criarPosto(nome, bandeira, dataAbertura, observacao);
  modalNovoPosto.classList.remove('open');
  STATE.postoId = id;
  STATE.tela = 'dashboard';
  render();
});

var modalCompartilhar = document.getElementById('modal-compartilhar');

function abrirCompartilhar(itemId){
  compartilharItemId = itemId;
  var posto = getPosto(STATE.postoId);
  var item = posto.itens.find(function(i){ return i.id===itemId; });
  document.getElementById('cp-pergunta-texto').textContent = item.item;
  var ligados = itensLigados(posto, item);
  var setoresOcupados = [item.setor].concat(ligados.map(function(li){ return li.setor; }));
  var lista = document.getElementById('cp-lista');
  var disponiveis = SETORES.filter(function(s){ return setoresOcupados.indexOf(s.key)<0; });
  lista.innerHTML = disponiveis.length
    ? disponiveis.map(function(s){
        return '<label class="compartilhar-row"><input type="checkbox" value="'+escapeAttr(s.key)+'"> '+s.icone+' '+escapeHtml(s.key)+'</label>';
      }).join('')
    : '<div style="font-size:12.5px;color:var(--muted)">Já compartilhada com todos os setores.</div>';
  modalCompartilhar.classList.add('open');
}
document.getElementById('cp-cancel').addEventListener('click', function(){ modalCompartilhar.classList.remove('open'); });
document.getElementById('cp-confirmar').addEventListener('click', function(){
  var posto = getPosto(STATE.postoId);
  var item = posto.itens.find(function(i){ return i.id===compartilharItemId; });
  var selecionados = Array.prototype.slice.call(document.querySelectorAll('#cp-lista input[type=checkbox]:checked')).map(function(c){ return c.value; });
  modalCompartilhar.classList.remove('open');
  if(!selecionados.length) return;
  if(!item.grupoId) item.grupoId = uid();
  selecionados.forEach(function(setorNovo){
    posto.itens.push({
      id: uid(), item: item.item, fase: item.fase, setor: setorNovo,
      responsavel: SETOR_RESPONSAVEL_DEFAULT[setorNovo] || '', status:'Pendente', observacao:'',
      historico:[], anexos:[], demandas:[], grupoId: item.grupoId
    });
  });
  saveData(posto.id);
  render();
});

function atualizarSyncStatus(){
  var el = document.getElementById('sync-status');
  if(!el) return;
  el.textContent = getScriptUrl() ? 'sincronização ativa' : 'sincronização não configurada';
}

/* ================= SYNC (Google Sheets via Apps Script) ================= */
var syncing = false;
// Conta pushes ainda em andamento. Antes, toda edição reenviava DATA.postos inteiro (todos
// os postos, com todos os itens) — o upsert() no backend apagava e reescrevia centenas de
// linhas a cada campo editado, então era comum o pull automático (a cada 2 min, "nuvem
// sempre vence") ler a planilha no meio de uma escrita ainda em andamento e desfazer uma
// transferência/edição recém-feita, exigindo tentar salvar várias vezes. Agora: 1) cada
// edição envia só o posto que mudou (bem mais rápido no backend) e 2) syncPull() nunca roda
// enquanto houver push pendente, pra nunca ler um estado parcial.
var pendingPushes = 0;
function syncPush(postoId){
  var url = getScriptUrl();
  if(!url) return;
  var postos = postoId ? [getPosto(postoId)].filter(Boolean) : DATA.postos;
  if(!postos.length) return;
  pendingPushes++;
  fetch(url, {
    method:'POST',
    body: JSON.stringify({ postos: postos })
  }).catch(function(){ /* falha silenciosa, dado já está salvo local */ })
    .then(function(){ pendingPushes--; });
}

function syncPull(){
  var url = getScriptUrl();
  if(!url || syncing || pendingPushes>0) return;
  syncing = true;
  // Cache-buster (?t=...) — sem isso o fetch às vezes devolvia uma resposta antiga do cache
  // do navegador em vez dos dados atuais, mascarando até transferências/edições já salvas.
  fetch(url+'?t='+Date.now()).then(function(r){ return r.json(); }).then(function(resp){
    syncing = false;
    if(!resp || !resp.ok) return;
    // Setores: catálogo compartilhado — a nuvem manda no ícone/nome (pega a versão mais
    // recente de quem editou em outro aparelho); setor novo achado na nuvem e ainda
    // ausente localmente é adicionado. Setor adicionado só localmente (ainda não
    // sincronizado) continua na lista até o próximo push.
    if(resp.setores && resp.setores.length){
      resp.setores.forEach(function(rs){
        var local = SETORES.find(function(s){ return s.key===rs.key; });
        if(local){ local.icone = rs.icone || local.icone; }
        else { SETORES.push({key:rs.key, icone:rs.icone||'📌'}); }
        if(rs.responsavel && SETOR_RESPONSAVEL_DEFAULT[rs.key]===undefined) SETOR_RESPONSAVEL_DEFAULT[rs.key] = rs.responsavel;
      });
      saveSetoresLocal();
    }
    // Demandas padrão: mescla por união — texto novo achado na nuvem (digitado por alguém
    // em outro aparelho) entra na lista local também, sem apagar nenhum já existente.
    if(resp.demandasPadrao && resp.demandasPadrao.length){
      resp.demandasPadrao.forEach(function(rd){
        if(!DEMANDAS_DEFAULT_POR_ITEM[rd.itemNome]) DEMANDAS_DEFAULT_POR_ITEM[rd.itemNome] = [];
        var lista = DEMANDAS_DEFAULT_POR_ITEM[rd.itemNome];
        (rd.textos||[]).forEach(function(t){
          if(!lista.some(function(l){ return l.toLowerCase()===t.toLowerCase(); })) lista.push(t);
        });
      });
      saveDemandasPadraoLocal();
    }
    if(!resp.postos) return;
    // Merge: nuvem é a fonte da verdade quando não há dado local ainda; pra itens que já
    // existem nos dois lados, a nuvem também vence — sem isso, um item transferido de setor
    // (ou com status/observação mudados) em outro aparelho nunca atualizava aqui, porque o
    // merge antigo só adicionava itens novos e nunca sobrescrevia os que já tinham sido
    // carregados antes. Como saveData() já empurra toda edição pra nuvem na hora, a versão
    // remota é sempre a mais recente na prática — só perde uma edição se dois aparelhos
    // editarem o mesmo item ao mesmo tempo sem internet, caso raro e sem solução simples aqui.
    var remotos = resp.postos;
    remotos.forEach(function(rp){
      var local = getPosto(rp.id);
      if(!local){
        DATA.postos.push(rp);
      } else {
        rp.itens.forEach(function(ri){
          var idx = local.itens.findIndex(function(i){ return i.id===ri.id; });
          if(idx<0) local.itens.push(ri);
          else local.itens[idx] = ri;
        });
      }
    });
    localStorage.setItem('ab_data', JSON.stringify(DATA));
    render();
  }).catch(function(){ syncing = false; });
}

/* ================= INIT ================= */
loadData();
loadSetores();
loadDemandasPadrao();
render();
syncPull();
setInterval(syncPull, 120000);
